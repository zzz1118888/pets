<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>寵物每一天 - 全物種大數據升級版</title>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { 
            height: 100dvh; width: 100%; margin: 0; padding: 0; 
            overflow: hidden; position: fixed; touch-action: none; 
            background-color: #f0f4f8; color: #334155; 
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: 700; 
        }
        ::-webkit-scrollbar { display: none; }
        
        .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
        .pt-safe { padding-top: max(1rem, env(safe-area-inset-top)); }
        
        .bg-polka-dots {
            background-color: #ecfdf5; 
            background-image: radial-gradient(#a7f3d0 2.5px, transparent 2.5px); 
            background-size: 28px 28px; 
        }

        .duo-btn-green { background-color: #58cc02; border: 2px solid #58a700; border-bottom: 6px solid #58a700; color: white; border-radius: 1.25rem; cursor: pointer; transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
        .duo-btn-green:active { border-bottom-width: 2px; transform: translateY(4px); margin-bottom: 4px; }
        .duo-btn-green:disabled { background-color: #e5e5e5; border-color: #e5e5e5; border-bottom-color: #cecece; color: #afafaf; transform: none; margin-bottom: 0; cursor: not-allowed; }
        
        .duo-btn-blue { background-color: #1cb0f6; border: 2px solid #1899d6; border-bottom: 6px solid #1899d6; color: white; border-radius: 1.25rem; cursor: pointer; transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
        .duo-btn-blue:active { border-bottom-width: 2px; transform: translateY(4px); margin-bottom: 4px; }
        
        .duo-btn-red { background-color: #ff4b4b; border: 2px solid #ea1515; border-bottom: 6px solid #ea1515; color: white; border-radius: 1.25rem; cursor: pointer; transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
        .duo-btn-red:active { border-bottom-width: 2px; transform: translateY(4px); margin-bottom: 4px; }
        
        .duo-btn-white { background-color: #ffffff; border: 2px solid #e2e8f0; border-bottom: 6px solid #cbd5e1; color: #64748b; border-radius: 1.25rem; cursor: pointer; transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
        .duo-btn-white:active { border-bottom-width: 2px; transform: translateY(4px); margin-bottom: 4px; }
        .duo-btn-white.active-tab { border-color: #1cb0f6; border-bottom-color: #1cb0f6; color: #1cb0f6; background-color: #ddf4ff; border-bottom-width: 2px; transform: translateY(4px); margin-bottom: 4px; }

        .duo-card { background-color: #ffffff; border: 2px solid #cbd5e1; border-radius: 1.5rem; box-shadow: 0 6px 0 #cbd5e1; margin-bottom: 6px; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .duo-card:hover { transform: translateY(-4px); box-shadow: 0 10px 0 #94a3b8; border-color: #94a3b8; }
        .duo-card-yellow { background-color: #ffc800; border: 2px solid #c68900; border-radius: 1.5rem; color: white; box-shadow: 0 6px 0 #c68900; margin-bottom: 6px; }
        
        .duo-input { background-color: #f8fafc; border: 2px solid #cbd5e1; border-radius: 1.25rem; color: #334155; font-weight: 800; outline: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .duo-input:focus { background-color: #ffffff; border-color: #1cb0f6; box-shadow: 0 0 0 4px rgba(28, 176, 246, 0.2); }
        
        @keyframes wiggle { 0%, 100% { transform: rotate(-6deg) scale(1.1); } 50% { transform: rotate(6deg) scale(1.1); } }
        .animate-wiggle { animation: wiggle 0.8s ease-in-out infinite; }
        
        .typing-dot { animation: typing 1.4s infinite ease-in-out; fill: #94a3b8; }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    </style>
</head>
<body>
    <div id="root" className="w-full h-full flex relative overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const DB_KEY_USERS = 'petApp_v16_users'; 
        const DB_KEY_POSTS = 'petApp_v16_posts'; 
        const DB_KEY_AUTH = 'petApp_v16_auth';   
        const DB_KEY_CURRENT_USER = 'petApp_v16_currentUser'; 
        const DB_KEY_API_TOKEN = 'petApp_v16_geminiToken';

        const defaultPosts = [
            { id: 2, author: 'LeoMom', avatar: '👩', petName: 'Leo', time: '1 小時前', timestamp: Date.now() - 3600000, content: '今天天氣超好，帶 Leo 去了寵物公園，結果牠交到了新朋友！跑了一下午回家直接秒睡 🤣', image: 'https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=500&q=80', likes: 12, likedByMe: false, comments: [{id: 1, author: '王大明', text: '太可愛了吧！'}] },
            { id: 1, author: 'CatLover99', avatar: '👨', petName: '咪咪', time: '3 小時前', timestamp: Date.now() - 10800000, content: '買了超貴的貓抓板給牠，結果牠只對旁邊的紙箱有興趣... 奴才心已死 💸', image: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=500&q=80', likes: 45, likedByMe: true, comments: [] }
        ];

        const speciesOptions = {
            '狗': ['米克斯 (混血/土狗)', '台灣犬', '柴犬', '貴賓犬', '法式鬥牛犬', '柯基', '黃金獵犬', '臘腸狗', '博美犬', '吉娃娃', '瑪爾濟斯', '邊境牧羊犬', '哈士奇', '拉布拉多', '薩摩耶', '雪納瑞', '其他 (請自行填寫)'],
            '貓': ['米克斯 (一般混血)', '三花貓', '橘貓', '賓士貓 (黑白貓)', '玳瑁貓', '黑貓', '白貓', '虎斑貓', '英國短毛貓', '美國短毛貓', '布偶貓', '曼赤肯 (短腿貓)', '緬因貓', '波斯貓', '俄羅斯藍貓', '暹羅貓', '其他 (請自行填寫)'],
            '鳥': ['玄鳳鸚鵡', '虎皮鸚鵡', '文鳥', '其他 (請自行填寫)'],
            '兔/鼠': ['侏儒兔', '垂耳兔', '天竺鼠', '黃金鼠', '其他 (請自行填寫)'],
            '爬蟲/其他': ['烏龜', '守宮', '蛇', '其他 (請自行填寫)']
        };

        const renderAvatar = (avatarStr, fallbackIcon = '👤') => {
            if(avatarStr && avatarStr.startsWith('data:image')) {
                return <img src={avatarStr} className="w-full h-full object-cover" />;
            }
            return <span className="flex items-center justify-center w-full h-full font-black text-2xl text-slate-400">{avatarStr || fallbackIcon}</span>;
        };

        const LoginScreen = ({ onLogin }) => {
            const [isLoginMode, setIsLoginMode] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');

            const handleAuth = () => {
                if (!email.trim() || !password.trim()) return alert('請完整輸入信箱與密碼！');
                const authDb = JSON.parse(localStorage.getItem(DB_KEY_AUTH)) || {};
                if (isLoginMode) {
                    if (!authDb[email]) return alert('找不到此信箱，請先註冊！');
                    if (authDb[email] !== password) return alert('密碼錯誤！');
                } else {
                    if (authDb[email]) return alert('此信箱已註冊，請直接登入。');
                    authDb[email] = password;
                    localStorage.setItem(DB_KEY_AUTH, JSON.stringify(authDb));
                }
                onLogin(email);
            };

            return (
                <div className="absolute inset-0 overflow-y-auto flex flex-col bg-gradient-to-br from-[#ffe066] to-[#f0f4f8]">
                    <div className="m-auto w-full max-w-md p-6 py-12 flex flex-col items-center justify-center pt-safe pb-safe">
                        <div className="text-center w-full mb-10">
                            <div className="text-6xl mb-6 text-[#58cc02] w-28 h-28 mx-auto duo-card flex items-center justify-center bg-white"><i className="fa-solid fa-paw"></i></div>
                            <h1 className="text-5xl font-black text-slate-800 tracking-tight drop-shadow-sm">寵物每一天</h1>
                            <p className="text-[16px] text-slate-600 mt-4 font-bold bg-white/50 px-4 py-1.5 rounded-full inline-block">專屬毛孩的健康遊戲管家</p>
                        </div>
                        <div className="w-full space-y-4 duo-card p-8 bg-white/95 backdrop-blur-md">
                            <input type="email" className="w-full duo-input p-4 text-[16px]" placeholder="輸入電子信箱" value={email} onChange={e => setEmail(e.target.value)} />
                            <input type="password" className="w-full duo-input p-4 text-[16px]" placeholder="輸入密碼" value={password} onChange={e => setPassword(e.target.value)} onKeyPress={e => e.key === 'Enter' && handleAuth()} />
                            <div className="w-full space-y-3 pt-6">
                                <button onClick={() => { setIsLoginMode(true); if(isLoginMode) handleAuth(); }} className={`w-full py-4 font-extrabold text-lg tracking-wide ${isLoginMode ? 'duo-btn-green' : 'duo-btn-white text-slate-400'}`}>登入系統</button>
                                <button onClick={() => { setIsLoginMode(false); if(!isLoginMode) handleAuth(); }} className={`w-full py-4 font-extrabold text-lg tracking-wide ${!isLoginMode ? 'duo-btn-blue' : 'duo-btn-white text-slate-400'}`}>註冊新帳號</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const PetForm = ({ initialData, onSave, onCancel, title }) => {
            const [formData, setFormData] = useState(initialData || { 
                id: Date.now(), name: '', species: '狗', breed: speciesOptions['狗'][0], customBreed: '', 
                gender: '男', isNeutered: '未絕育', status: '活潑健康',
                age: '', weight: '', height: '', length: '' 
            });
            const submit = () => {
                if (!formData.name.trim()) return alert('請填寫寵物名字！');
                const finalBreed = formData.breed.includes('其他') ? formData.customBreed : formData.breed;
                if (!finalBreed.trim()) return alert('請填寫品種！');
                onSave({ ...formData, breed: finalBreed });
            };
            return (
                <div className="duo-card p-8 max-w-md w-full mx-auto my-4 bg-white">
                    <h2 className="text-3xl font-black text-center mb-8 text-slate-800">{title || '建立新角色'}</h2>
                    <div className="space-y-5">
                        <div>
                            <label className="block text-sm font-extrabold text-slate-400 mb-2 uppercase tracking-wide">名字</label>
                            <input type="text" className="w-full duo-input p-4 text-[16px]" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} placeholder="例如：毛毛" />
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="block text-sm font-extrabold text-slate-400 mb-2 uppercase tracking-wide">物種</label>
                                <select className="w-full duo-input p-4 cursor-pointer text-[16px]" value={formData.species} onChange={e => setFormData({...formData, species: e.target.value, breed: speciesOptions[e.target.value][0], customBreed: ''})}>{Object.keys(speciesOptions).map(s => <option key={s} value={s}>{s}</option>)}</select>
                            </div>
                            <div><label className="block text-sm font-extrabold text-slate-400 mb-2 uppercase tracking-wide">品種</label>
                                <select className="w-full duo-input p-4 cursor-pointer text-[16px]" value={formData.breed} onChange={e => setFormData({...formData, breed: e.target.value})}>{speciesOptions[formData.species].map(b => <option key={b} value={b}>{b}</option>)}</select>
                            </div>
                        </div>
                        {formData.breed.includes('其他') && <input type="text" className="w-full duo-input p-4 text-[16px]" value={formData.customBreed} onChange={e => setFormData({...formData, customBreed: e.target.value})} placeholder="請輸入品種" />}
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="block text-sm font-extrabold text-slate-400 mb-2 uppercase tracking-wide">性別</label>
                                <select className="w-full duo-input p-4 cursor-pointer text-[16px]" value={formData.gender} onChange={e => setFormData({...formData, gender: e.target.value})}><option value="男">男生</option><option value="女">女生</option></select>
                            </div>
                            <div><label className="block text-sm font-extrabold text-slate-400 mb-2 uppercase tracking-wide">絕育狀態</label>
                                <select className="w-full duo-input p-4 cursor-pointer text-[16px]" value={formData.isNeutered} onChange={e => setFormData({...formData, isNeutered: e.target.value})}><option value="未絕育">未絕育</option><option value="已絕育">已絕育</option></select>
                            </div>
                        </div>

                        <div className="pt-4 border-t-2 border-slate-100">
                            <label className="block text-sm font-extrabold text-[#1cb0f6] mb-4 uppercase tracking-wide"><i className="fa-solid fa-ruler"></i> 精準體態數據 (推薦填寫)</label>
                            <div className="grid grid-cols-2 gap-4">
                                <div><input type="number" step="0.1" className="w-full duo-input p-4 text-[15px]" value={formData.age} onChange={e => setFormData({...formData, age: e.target.value})} placeholder="年齡 (歲)" /></div>
                                <div><input type="number" step="0.1" className="w-full duo-input p-4 text-[15px]" value={formData.weight} onChange={e => setFormData({...formData, weight: e.target.value})} placeholder="體重 (kg)" /></div>
                                <div><input type="number" step="0.1" className="w-full duo-input p-4 text-[15px]" value={formData.height} onChange={e => setFormData({...formData, height: e.target.value})} placeholder="身高 (cm)" /></div>
                                <div><input type="number" step="0.1" className="w-full duo-input p-4 text-[15px]" value={formData.length} onChange={e => setFormData({...formData, length: e.target.value})} placeholder="體長 (cm)" /></div>
                            </div>
                        </div>

                        <div className="pt-6 flex flex-col md:flex-row gap-4">
                            {onCancel && <button onClick={onCancel} className="w-full duo-btn-white py-4 font-extrabold text-lg">取消</button>}
                            <button onClick={submit} className="w-full duo-btn-green py-4 font-extrabold text-lg tracking-wider">確認完成</button>
                        </div>
                    </div>
                </div>
            );
        };

        const OnboardingWizard = ({ onComplete }) => {
            const [pets, setPets] = useState([]);
            const [isAdding, setIsAdding] = useState(true);

            const handleSavePet = (petData) => { setPets([...pets, petData]); setIsAdding(false); };

            if (isAdding) return (
                <div className="absolute inset-0 overflow-y-auto flex flex-col bg-[#f0f4f8]">
                    <div className="m-auto w-full p-4 flex justify-center pt-safe pb-safe">
                        <PetForm key={pets.length} title={pets.length === 0 ? "建立第一隻寵物角色" : "新增其他寵物角色"} onSave={handleSavePet} onCancel={pets.length > 0 ? () => setIsAdding(false) : null} />
                    </div>
                </div>
            );

            return (
                <div className="absolute inset-0 overflow-y-auto flex flex-col bg-[#f0f4f8]">
                    <div className="m-auto w-full max-w-md p-4 pt-safe pb-safe">
                        <div className="duo-card p-10 w-full text-center bg-white">
                            <div className="w-28 h-28 bg-[#58cc02] text-white rounded-full flex items-center justify-center text-6xl mx-auto mb-8 border-b-8 border-[#58a700]"><i className="fa-solid fa-check"></i></div>
                            <h2 className="text-4xl font-black mb-4 text-slate-800">太棒了！</h2>
                            <p className="text-slate-500 mb-8 font-extrabold text-lg">您已解鎖 {pets.length} 隻毛孩角色</p>
                            <div className="space-y-4 mb-10 text-left">
                                {pets.map(p => (
                                    <div key={p.id} className="duo-card p-4 flex items-center justify-between border-2 border-[#e2e8f0] shadow-sm mb-0">
                                        <div className="flex items-center gap-5">
                                            <div className="w-16 h-16 rounded-full bg-[#f8fafc] flex items-center justify-center text-4xl border-2 border-[#e2e8f0] shadow-inner">{p.species === '貓' ? '🐱' : p.species === '狗' ? '🐶' : p.species === '鳥' ? '🐦' : p.species === '兔/鼠' ? '🐰' : '🦎'}</div>
                                            <div>
                                                <p className="font-black text-xl text-slate-800">{p.name}</p>
                                                <p className="text-[14px] text-slate-500 font-extrabold mt-1">{p.breed}</p>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="space-y-4">
                                <button onClick={() => setIsAdding(true)} className="w-full duo-btn-white py-4 font-extrabold text-lg text-[#1cb0f6]"><i className="fa-solid fa-plus mr-2"></i> 新增更多寵物</button>
                                <button onClick={() => onComplete(pets)} className="w-full duo-btn-green py-4 font-extrabold text-lg tracking-wider text-xl">開始每日任務！</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SettingsModal = ({ userData, onClose, onUpdateUser }) => {
            const [name, setName] = useState(userData.name);
            const [avatar, setAvatar] = useState(userData.avatar);
            const [editingPet, setEditingPet] = useState(null);
            const [isCreatingPet, setIsCreatingPet] = useState(false); 
            const [apiKey, setApiKey] = useState(localStorage.getItem(DB_KEY_API_TOKEN) || '');
            const avatarInputRef = useRef(null);

            const handleSave = () => { onUpdateUser({ ...userData, name, avatar }); localStorage.setItem(DB_KEY_API_TOKEN, apiKey); onClose(); };

            if (editingPet) return <div className="absolute inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm pt-safe pb-safe"><PetForm initialData={editingPet} title="編輯角色資料" onSave={(updatedPet) => { onUpdateUser({ ...userData, pets: userData.pets.map(p => p.id === updatedPet.id ? updatedPet : p) }); setEditingPet(null); }} onCancel={() => setEditingPet(null)} /></div>;
            if (isCreatingPet) return <div className="absolute inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm pt-safe pb-safe"><PetForm title="解鎖新角色" onSave={(newPet) => { onUpdateUser({ ...userData, pets: [...userData.pets, newPet] }); setIsCreatingPet(false); }} onCancel={() => setIsCreatingPet(false)} /></div>;

            return (
                <div className="absolute inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-2 md:p-4 backdrop-blur-sm pt-safe pb-safe">
                    <div className="bg-[#f8fafc] w-full max-w-lg rounded-3xl overflow-hidden flex flex-col max-h-[90dvh] border-4 border-white shadow-2xl">
                        <div className="p-6 flex justify-between items-center border-b-2 border-slate-200 bg-white shrink-0">
                            <h3 className="font-black text-2xl text-slate-800">玩家與系統設定</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-[#ff4b4b] w-10 h-10 rounded-full border-2 border-slate-200 bg-slate-50 flex items-center justify-center font-bold transition-colors text-lg"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1">
                            <h4 className="text-sm font-black text-slate-400 mb-4 uppercase tracking-wider">玩家資料</h4>
                            <div className="flex items-center gap-6 mb-8 duo-card p-6 bg-white border-slate-200 shadow-sm">
                                <div className="relative w-24 h-24 rounded-2xl overflow-hidden border-2 border-slate-200 bg-slate-100 cursor-pointer group flex-shrink-0" onClick={() => avatarInputRef.current.click()}>
                                    {renderAvatar(avatar)}
                                    <div className="absolute inset-0 bg-slate-900/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><i className="fa-solid fa-camera text-white text-2xl"></i></div>
                                </div>
                                <input type="file" accept="image/*" className="hidden" ref={avatarInputRef} onChange={e => {
                                    if (e.target.files[0]) { const reader = new FileReader(); reader.onloadend = () => setAvatar(reader.result); reader.readAsDataURL(e.target.files[0]); }
                                }} />
                                <div className="flex-1">
                                    <label className="block text-xs font-black text-slate-400 mb-2 uppercase tracking-wide">顯示名稱</label>
                                    <input type="text" className="w-full duo-input p-4 text-[16px]" value={name} onChange={e => setName(e.target.value)} />
                                </div>
                            </div>
                            <h4 className="text-sm font-black text-slate-400 mb-4 uppercase tracking-wider flex justify-between items-center">
                                <span>AI 博士引擎 (Gemini API)</span><a href="https://aistudio.google.com/" target="_blank" className="text-[#1cb0f6] hover:underline text-xs">取得 Key</a>
                            </h4>
                            <div className="mb-8 duo-card p-6 bg-[#ddf4ff] border-[#1cb0f6] shadow-[0_4px_0_#1cb0f6]">
                                <input type="password" className="w-full duo-input border-white p-4 text-[16px] bg-white" placeholder="AIzaSy..." value={apiKey} onChange={e => setApiKey(e.target.value)} />
                                <p className="text-[13px] text-[#1899d6] mt-3 font-extrabold">將 Key 存在本機，解鎖 AI 獸醫博士的圖片診斷技能！</p>
                            </div>
                            <h4 className="text-sm font-black text-slate-400 mb-4 uppercase tracking-wider">管理寵物角色</h4>

                    daily.push('🧹 清理籠子底部托盤', '🥬 準備新鮮蔬果');
                    periodic.push('✂️ 定期修剪指甲', '🛁 提供溫水讓鳥兒沐浴');
                    if (age < 1) daily.push('🍼 定時餵食鳥奶粉/學吃');
                    periodic.push('🩺 鳥禽專科定期健檢', '🦠 體內外驅蟲檢查');
                } else if (pet.species === '兔/鼠') {
                    daily.push('🧹 清理便盆與墊材', '🌾 補充無限量牧草');
                    periodic.push('✂️ 定期修剪指甲', '🩺 牙齒與臼齒健康檢查');
                    if (pet.breed.includes('長毛')) daily.push('✂️ 梳理毛髮防毛球症');
                    periodic.push('🦠 定期驅蟲與皮毛檢查');
                } else {
                    daily.push('🧹 清潔居住環境', '🌡️ 檢查環境溫濕度');
                    periodic.push('💡 定期更換 UVB 燈管', '🩺 特寵專科健康檢查', '🦠 糞便寄生蟲檢查');
                }

                if (pet.isNeutered === '未絕育' && (pet.species === '狗' || pet.species === '貓' || pet.species === '兔/鼠')) {
                    if (age >= 0.5 || !age) periodic.push('🏥 諮詢與安排絕育手術');
                }

                return { daily, periodic };
            };

            const getTodayDateString = () => {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            };

            const addReminder = (petId, predefinedText = null) => {
                const text = predefinedText || newReminderData[petId]?.text;
                const targetDate = newReminderData[petId]?.date || getTodayDateString();
                
                if(!text || !text.trim()) return alert('請填寫任務內容！');
                
                if (reminders.some(r => r.text === text && r.petId === petId && r.targetDate === targetDate)) return;

                const updated = [...reminders, { id: Date.now() + Math.random(), petId, text: text, targetDate: targetDate, completed: false }];
                setReminders(updated); onUpdateUser({...userData, customReminders: updated});
                
                if (!predefinedText) {
                    setNewReminderData({...newReminderData, [petId]: { text: '', date: '' }});
                }
            };

            const toggleCompleted = (id) => {
                const updated = reminders.map(r => r.id === id ? { ...r, completed: !r.completed } : r);
                setReminders(updated); onUpdateUser({...userData, customReminders: updated});
            };

            const isTodayOrOverdue = (dateString) => {
                if (!dateString) return false;
                const today = new Date(); today.setHours(0,0,0,0);
                return new Date(dateString) <= today;
            };

            const hasPostedToday = (petName) => {
                const todayStr = new Date().toDateString();
                return posts.some(p => p.author === userData.name && p.petName === petName && new Date(p.timestamp).toDateString() === todayStr);
            };

            const rec = getBreedRecommendation(pet);
            const suggested = getSuggestedTasks(pet);
            const petReminders = reminders.filter(r => r.petId === pet.id);
            const urgentCount = petReminders.filter(r => !r.completed && isTodayOrOverdue(r.targetDate)).length;
            const noPostToday = !hasPostedToday(pet.name);
            const showWarning = (pet.gender === '女' && pet.isNeutered === '未絕育') || noPostToday || urgentCount > 0;

            return (
                <div className="p-4 md:p-8 overflow-y-auto h-full pb-32 md:pb-8 max-w-4xl mx-auto w-full">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pt-safe">
                        <div className="flex items-center gap-4">
                            <h2 className="text-3xl font-black text-slate-800 flex items-center gap-3"><span className="text-4xl">🎯</span> 每日任務</h2>
                            <div className="flex items-center bg-white border-2 border-slate-200 rounded-2xl px-4 py-2 shadow-[0_4px_0_#e2e8f0] font-black text-[#ffc800] text-xl transform rotate-2">
                                <i className="fa-solid fa-fire mr-2 text-2xl"></i> 1 天

                                {userData.pets.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="duo-card p-6 shadow-sm mb-6 bg-white border-b-[8px] border-slate-200">
                        <div className="flex items-start gap-5 mb-6 border-b-2 border-slate-100 pb-6">
                            <div className="w-20 h-20 rounded-full bg-slate-50 border-2 border-slate-200 flex items-center justify-center text-4xl shadow-inner shrink-0 mt-1">
                                {/* 💡 頭像 Emoji 完美適配全物種 */}
                                {pet.species === '貓' ? '🐱' : pet.species === '狗' ? '🐶' : pet.species === '鳥' ? '🐦' : pet.species === '兔/鼠' ? '🐰' : '🦎'}
                            </div>
                            <div>
                                <h3 className="text-3xl font-black text-slate-800">{pet.name} 的等級資訊</h3>
                                <div className="flex flex-wrap gap-2 mt-3">
                                    <span className="text-[14px] font-extrabold text-slate-500 bg-slate-100 px-3 py-1 rounded-lg border border-slate-200">{pet.breed} · {pet.gender} ({pet.isNeutered})</span>
                                    {pet.age && <span className="text-[14px] bg-[#ddf4ff] text-[#1cb0f6] px-3 py-1 rounded-lg font-black border border-[#1cb0f6]/30">{pet.age} 歲</span>}
                                    {pet.weight && <span className="text-[14px] bg-[#ddf4ff] text-[#1cb0f6] px-3 py-1 rounded-lg font-black border border-[#1cb0f6]/30">{pet.weight} kg</span>}
                                    {pet.height && <span className="text-[14px] bg-[#f7fee7] text-[#58a700] px-3 py-1 rounded-lg font-black border border-[#58a700]/30">高 {pet.height} cm</span>}
                                    {pet.length && <span className="text-[14px] bg-[#f7fee7] text-[#58a700] px-3 py-1 rounded-lg font-black border border-[#58a700]/30">長 {pet.length} cm</span>}
                                </div>
                            </div>
                        </div>

                        <div className={`relative overflow-hidden p-6 md:p-8 mb-8 ${rec.color}`}>
                            <div className="relative z-10">
                                <div className="flex justify-between items-center mb-4">
                                    <p className="text-sm font-black uppercase tracking-widest text-white/90 drop-shadow-sm"><i className="fa-solid fa-star mr-2 text-white"></i> 專屬被動技能</p>

                                <p className="font-black text-3xl mb-3 drop-shadow-md">{rec.name}</p>

                                    <p className="text-[15px] font-bold text-white/90 leading-relaxed">{getDietRecommendation(pet)}</p>

                                {pet.gender === '女' && pet.isNeutered === '未絕育' && (

                                                    </div>

                                                        <p className={`text-[18px] font-black ${r.completed ? 'text-slate-400 line-through' : 'text-slate-800'}`}>{r.text}</p>

                                                    </div>
                                                </div>
                                                <button onClick={() => {
                                                    const updated = reminders.filter(item => item.id !== r.id);
                                                    setReminders(updated); onUpdateUser({...userData, customReminders: updated});
                                                }} className="w-12 h-12 rounded-full duo-btn-white text-slate-400 hover:text-[#ff4b4b] !p-0 !border-b-4 flex justify-center items-center text-xl bg-slate-50"><i className="fa-solid fa-trash-can"></i></button>
                                            </div>
                                        )
                                    })
                                }
                            </div>

                            <div className="pt-8 border-t-2 border-slate-100">
                                <p className="text-[16px] font-black text-slate-800 mb-4"><i className="fa-solid fa-lightbulb text-[#ffc800] mr-2"></i> 新手必備：點擊快速加入</p>
                                
                                <p className="text-[13px] font-extrabold text-slate-500 mb-3 ml-1">🌞 每日日常照顧</p>
                                <div className="flex flex-wrap gap-2.5 mb-5">
                                    {suggested.daily.map(task => (
                                        <button key={task} onClick={() => addReminder(pet.id, task)} className="text-[14px] font-black text-[#1cb0f6] bg-[#ddf4ff] border-2 border-[#1cb0f6]/30 px-4 py-2 rounded-full hover:bg-[#1cb0f6] hover:text-white transition-colors active:scale-95 shadow-sm">
                                            + {task}
                                        </button>
                                    ))}
                                </div>

                                <p className="text-[13px] font-extrabold text-slate-500 mb-3 ml-1">🗓️ 定期健康與美容</p>
                                <div className="flex flex-wrap gap-2.5 mb-8">
                                    {suggested.periodic.map(task => (
                                        <button key={task} onClick={() => addReminder(pet.id, task)} className="text-[14px] font-black text-[#58cc02] bg-[#f7fee7] border-2 border-[#58a700]/30 px-4 py-2 rounded-full hover:bg-[#58cc02] hover:text-white transition-colors active:scale-95 shadow-sm">
                                            + {task}
                                        </button>
                                    ))}
                                </div>

                                <div className="flex flex-col md:flex-row gap-4 pt-6 border-t-2 border-slate-100">
                                    <input type="text" className="flex-1 duo-input p-4 text-[16px] bg-slate-50 shadow-inner" placeholder="或輸入自訂任務 (如：買零食)" 
                                        value={newReminderData[pet.id]?.text || ''} onChange={e => setNewReminderData({...newReminderData, [pet.id]: { ...newReminderData[pet.id], text: e.target.value }})} />
                                    <div className="flex gap-3">
                                        <input type="date" className="flex-1 md:w-[150px] duo-input p-4 text-[16px] text-slate-600 bg-slate-50 font-black shadow-inner" 
                                            value={newReminderData[pet.id]?.date || ''} onChange={e => setNewReminderData({...newReminderData, [pet.id]: { ...newReminderData[pet.id], date: e.target.value }})} />
                                        <button onClick={() => addReminder(pet.id)} className="duo-btn-green px-8 py-4 font-black text-[16px] border-b-4 tracking-widest text-lg">新增</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AIVetTab = ({ userData }) => {
            const [messages, setMessages] = useState([{ sender: 'bot', text: `你好！我是 AI 獸醫博士 🦉。是哪隻毛孩遇到困難了？請描述症狀，或上傳照片讓我診斷。` }]);
            const [input, setInput] = useState('');
            const [imageAttachment, setImageAttachment] = useState(null); 
            const [isTyping, setIsTyping] = useState(false);
            const chatContainerRef = useRef(null);
            const fileInputRef = useRef(null);

            const callGeminiAPI = async (userText, imageBase64) => {
                const GEMINI_API_KEY = localStorage.getItem(DB_KEY_API_TOKEN);
                if (!GEMINI_API_KEY) return `⚠️ 您尚未裝備「AI 智慧核心 (API Key)」！\n\n請前往左側「管理設定」，填入您的 Gemini API Key 來解鎖真正的博士智慧！`;

                const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                
                const petsInfo = userData?.pets?.map(p => `- ${p.name} (${p.species}, ${p.breed}, ${p.gender}, ${p.isNeutered}, 歲數:${p.age||'未知'}, 體重:${p.weight||'未知'}kg, 身高:${p.height||'未知'}cm, 體長:${p.length||'未知'}cm)`).join('\n') || '無詳細資料';
                
                const promptText = `你是一位講話像卡通人物、非常熱情但專業的 AI 獸醫博士（類似多鄰國的 Duo 貓頭鷹）。\n使用者的毛孩角色：\n${petsInfo}\n\n使用者諮詢描述：${userText || '（主要上傳了圖片）'}\n\n1. 語氣熱情、幽默，多用表情符號，但醫療建議必須嚴謹。\n2. 若有年齡體重等數據，請在回答中適當提及該數據對健康的影響。\n3. ⚠️ 若發現嚴重症狀，請用【緊急任務】警示主人立即送醫。\n4. 若有照片，請認真觀察照片給出建議。`;

                const parts = [];
                if (imageBase64) {
                    const base64Data = imageBase64.split(',')[1];
                    const mimeType = imageBase64.substring(imageBase64.indexOf(":") + 1, imageBase64.indexOf(";"));
                    parts.push({ inline_data: { mime_type: mimeType, data: base64Data } });
                }
                parts.push({ text: promptText });

                try {
                    const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts }] }) });
                    const data = await response.json();
                    if (data.error) return `❌ 系統錯誤：${data.error.message}。\n請檢查 Key 是否正確。`;
                    if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) return data.candidates[0].content.parts[0].text;
                    return "博士現在有點暈頭轉向，請稍後再試。";
                } catch (err) {
                    console.error("Gemini API Error:", err);
                    return "網路連線中斷了，博士接收不到訊號！";
                }
            };

            const handleSend = async () => {
                if (!input.trim() && !imageAttachment) return;
                const userText = input.trim(); const currentImg = imageAttachment;
                setInput(''); setImageAttachment(null);
                const newMsgs = [...messages, { sender: 'user', text: userText, image: currentImg }];
                setMessages(newMsgs); setIsTyping(true);

                const botReply = await callGeminiAPI(userText, currentImg);
                setIsTyping(false); setMessages([...newMsgs, { sender: 'bot', text: botReply }]);
            };

            useEffect(() => {
                if (chatContainerRef.current) {
                    chatContainerRef.current.scrollTo({ top: chatContainerRef.current.scrollHeight, behavior: 'smooth' });

            }, [messages, isTyping]);

            return (
                <div className="flex flex-col h-full w-full bg-polka-dots">
                    <div className="bg-white/90 backdrop-blur-md border-b-2 border-slate-200 p-4 md:p-6 shrink-0 w-full z-20 shadow-sm pt-safe">

                    <div className="flex-1 overflow-y-auto p-4 md:p-6 w-full pb-32 md:pb-6" ref={chatContainerRef}>

                                <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    {msg.sender === 'bot' && idx > 0 && <div className="w-10 h-10 md:w-12 md:h-12 rounded-full bg-[#ffc800] text-white flex items-center justify-center text-xl md:text-2xl mr-3 md:mr-4 mt-auto shrink-0 border-b-4 border-[#c68900] shadow-sm"><i className="fa-solid fa-user-doctor"></i></div>}
                                    <div className={`max-w-[85%] md:max-w-[75%] p-4 md:p-5 text-[15px] md:text-[16px] whitespace-pre-wrap font-black leading-relaxed border-2 ${msg.sender === 'user' ? 'bg-[#1cb0f6] text-white border-[#1cb0f6] rounded-[1.5rem] rounded-br-md shadow-[0_6px_0_#1899d6]' : 'bg-white text-slate-700 border-slate-200 rounded-[1.5rem] rounded-bl-md shadow-[0_6px_0_#e2e8f0]'}`}>

                                        {msg.text}
                                    </div>
                                </div>
                            ))}
                            {isTyping && (
                                <div className="flex justify-start">
                                    <div className="w-10 h-10 md:w-12 md:h-12 rounded-full bg-[#ffc800] text-white flex items-center justify-center text-xl md:text-2xl mr-3 md:mr-4 mt-auto shrink-0 border-b-4 border-[#c68900] shadow-sm"><i className="fa-solid fa-user-doctor"></i></div>
                                    <div className="bg-white border-2 border-slate-200 p-4 md:p-5 rounded-[1.5rem] rounded-bl-md shadow-[0_6px_0_#e2e8f0] flex gap-2 items-center"><svg height="10" width="10" className="typing-dot"><circle cx="5" cy="5" r="5"/></svg><svg height="10" width="10" className="typing-dot"><circle cx="5" cy="5" r="5"/></svg><svg height="10" width="10" className="typing-dot"><circle cx="5" cy="5" r="5"/></svg></div>

                    <div className="absolute bottom-[90px] md:bottom-0 left-0 right-0 p-4 md:p-5 bg-white/90 backdrop-blur-md border-t-2 border-slate-200 w-full z-20 shadow-[0_-4px_15px_rgba(0,0,0,0.03)] pb-safe">
                        <div className="max-w-4xl mx-auto w-full">
                            {imageAttachment && (
                                <div className="relative inline-block w-20 h-20 md:w-24 md:h-24 mb-3">
                                    <img src={imageAttachment} className="w-full h-full object-cover rounded-xl border-2 border-slate-200 shadow-sm" />
                                    <button onClick={() => setImageAttachment(null)} className="absolute -top-3 -right-3 duo-btn-red w-8 h-8 flex items-center justify-center text-sm !p-0 !border-b-4"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                            )}
                            <div className="flex gap-3 md:gap-4 items-center w-full">
                                <input type="file" accept="image/*" className="hidden" ref={fileInputRef} onChange={e => {
                                    if(e.target.files[0]) { const reader = new FileReader(); reader.onloadend = () => setImageAttachment(reader.result); reader.readAsDataURL(e.target.files[0]); }
                                }} />
                                <button onClick={() => fileInputRef.current.click()} className="duo-btn-white w-12 h-12 md:w-14 md:h-14 flex items-center justify-center text-2xl text-[#1cb0f6] !p-0 !border-b-[6px] shrink-0 bg-slate-50"><i className="fa-solid fa-camera"></i></button>
                                <input type="text" className="flex-1 duo-input p-3.5 md:p-4 text-[15px] md:text-[16px] bg-slate-50 shadow-inner" placeholder="輸入訊息..." value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleSend()} disabled={isTyping} />
                                <button onClick={handleSend} disabled={isTyping || (!input.trim() && !imageAttachment)} className={`w-12 h-12 md:w-14 md:h-14 flex items-center justify-center text-2xl shrink-0 !p-0 !border-b-[6px] ${(!input.trim() && !imageAttachment) || isTyping ? 'duo-btn-white text-slate-300 cursor-not-allowed bg-slate-50' : 'duo-btn-blue'}`}><i className="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentUser, setCurrentUser] = useState(localStorage.getItem(DB_KEY_CURRENT_USER));
            const [userData, setUserData] = useState(null); 
            const [activeTab, setActiveTab] = useState('home');
            const [posts, setPosts] = useState([]);
            const [showSettings, setShowSettings] = useState(false);

            useEffect(() => {
                const savedPosts = JSON.parse(localStorage.getItem(DB_KEY_POSTS));
                if (savedPosts && savedPosts.length > 0) setPosts(savedPosts);
                else { setPosts(defaultPosts); localStorage.setItem(DB_KEY_POSTS, JSON.stringify(defaultPosts)); }

                if (currentUser) {
                    const usersDb = JSON.parse(localStorage.getItem(DB_KEY_USERS)) || {};
                    if (usersDb[currentUser]?.pets?.length > 0) setUserData(usersDb[currentUser]);
                }
            }, [currentUser]);

            const handleLogin = (email) => {
                localStorage.setItem(DB_KEY_CURRENT_USER, email); setCurrentUser(email);
                const usersDb = JSON.parse(localStorage.getItem(DB_KEY_USERS)) || {};
                setUserData(usersDb[email]?.pets?.length > 0 ? usersDb[email] : null);
            };

            const handleUpdateUser = (newData) => {
                const usersDb = JSON.parse(localStorage.getItem(DB_KEY_USERS)) || {};
                const oldName = userData?.name;
                const oldAvatar = userData?.avatar;
                
                usersDb[currentUser] = newData; 
                localStorage.setItem(DB_KEY_USERS, JSON.stringify(usersDb));
                setUserData(newData);

                if ((oldName && oldName !== newData.name) || (oldAvatar && oldAvatar !== newData.avatar)) {
                    const savedPosts = JSON.parse(localStorage.getItem(DB_KEY_POSTS)) || posts;
                    const updatedPosts = savedPosts.map(p => {
                        let pCopy = { ...p };
                        if (pCopy.author === oldName) {
                            pCopy.author = newData.name;
                            if (oldAvatar !== newData.avatar) pCopy.avatar = newData.avatar;
                        }
                        pCopy.comments = pCopy.comments.map(c => c.author === oldName ? { ...c, author: newData.name } : c);
                        return pCopy;
                    });
                    setPosts(updatedPosts);
                    localStorage.setItem(DB_KEY_POSTS, JSON.stringify(updatedPosts));
                }
            };

            const handleLogout = () => { localStorage.removeItem(DB_KEY_CURRENT_USER); setCurrentUser(null); setUserData(null); };

            if (!currentUser) return <LoginScreen onLogin={handleLogin} />;
            
            if (!userData) {
                return <OnboardingWizard onComplete={(pets) => {
                    handleUpdateUser({ name: currentUser.split('@')[0], avatar: '👤', pets: pets, customReminders: [] });
                }} />;
            }

            return (
                <div className="flex w-full bg-polka-dots overflow-hidden relative fixed inset-0" style={{ height: '100dvh' }}>
                    {/* 🌟 左側 Sidebar：增強的陰影對比與高度固定 */}
                    <div className="hidden md:flex flex-col w-[320px] bg-gradient-to-br from-[#ffe066] to-[#fff2a8] border-r-2 border-[#e5e5e5] z-30 h-full relative shadow-[8px_0_30px_rgba(0,0,0,0.08)]">
                        <div className="flex-1 overflow-y-auto p-5 min-h-0 pt-safe">
                            
                            {/* 🧊 裝飾：毛玻璃質感個人資料卡片 */}
                            <div className="flex items-center gap-4 mb-6 py-3 px-4 rounded-2xl bg-white/40 backdrop-blur-md border-2 border-white/60 shadow-sm relative overflow-hidden">
                                <div className="w-14 h-14 rounded-full overflow-hidden border-2 border-white bg-slate-50 flex-shrink-0 shadow-sm">{renderAvatar(userData.avatar)}</div>
                                <div className="overflow-hidden relative z-10">
                                    <p className="font-black text-xl text-slate-800 truncate">{userData.name}</p>
                                    <p className="text-[13px] text-slate-600 font-extrabold mt-1 truncate">{currentUser}</p>
                                </div>
                            </div>
                            
                            <div className="space-y-3 mb-4">
                                {/* 🎨 裝飾：未選中按鈕顏色加深為 text-slate-700 */}
                                <button onClick={() => setActiveTab('home')} className={`w-full text-left p-4 font-black flex items-center gap-4 text-[17px] transition-all group ${activeTab==='home'?'duo-btn-white active-tab':'text-slate-700 hover:bg-white/60 rounded-[1.25rem] border-2 border-transparent'}`}>
                                    <i className={`fa-solid fa-house text-xl w-8 text-center group-hover:text-[#1cb0f6] ${activeTab==='home'?'animate-wiggle text-[#1cb0f6]':''}`}></i> 動態村
                                </button>
                                <button onClick={() => setActiveTab('reminders')} className={`w-full text-left p-4 font-black flex items-center gap-4 text-[17px] transition-all group ${activeTab==='reminders'?'duo-btn-white active-tab':'text-slate-700 hover:bg-white/60 rounded-[1.25rem] border-2 border-transparent'}`}>
                                    <i className={`fa-solid fa-list-check text-xl w-8 text-center group-hover:text-[#1cb0f6] ${activeTab==='reminders'?'animate-wiggle text-[#1cb0f6]':''}`}></i> 每日任務
                                </button>
                                <button onClick={() => setActiveTab('aivet')} className={`w-full text-left p-4 font-black flex items-center gap-4 text-[17px] transition-all group ${activeTab==='aivet'?'duo-btn-white active-tab':'text-slate-700 hover:bg-white/60 rounded-[1.25rem] border-2 border-transparent'}`}>
                                    <i className={`fa-solid fa-user-doctor text-xl w-8 text-center group-hover:text-[#1cb0f6] ${activeTab==='aivet'?'animate-wiggle text-[#1cb0f6]':''}`}></i> AI 博士
                                </button>
                            </div>
                        </div>
                        <div className="shrink-0 p-5 border-t-2 border-white/40 space-y-3 pb-safe">
                            <button onClick={() => setShowSettings(true)} className="w-full duo-btn-white py-3 font-black text-[15px] border-b-[6px] flex items-center justify-center text-slate-700 bg-white/90 hover:bg-white"><i className="fa-solid fa-gear mr-2 text-lg"></i> 管理設定</button>
                            <button onClick={handleLogout} className="w-full duo-btn-white py-3 text-[#ff4b4b] font-black text-[15px] border-b-[6px] flex items-center justify-center bg-white/90 hover:bg-white"><i className="fa-solid fa-right-from-bracket mr-2 text-lg"></i> 登出</button>
                        </div>
                    </div>

                    {/* 右側主內容區 */}
                    <div className="flex-1 flex flex-col relative w-full h-full overflow-hidden bg-polka-dots z-10">
                        <div className="md:hidden h-[80px] bg-white/90 backdrop-blur-md flex items-center justify-between px-6 border-b-2 border-slate-200 shrink-0 z-20 pt-safe shadow-sm">
                            <div className="font-black text-3xl text-[#58cc02] tracking-tight flex items-center gap-3 drop-shadow-sm"><i className="fa-solid fa-paw"></i> 寵物村</div>
                            <div className="flex items-center gap-5">
                                <button onClick={() => setShowSettings(true)} className="w-12 h-12 rounded-full overflow-hidden border-2 border-slate-200 bg-slate-50 shadow-sm">{renderAvatar(userData.avatar)}</button>
                            </div>
                        </div>
                        
                        <div className="flex-1 overflow-hidden relative">
                            {activeTab === 'home' && <HomeTab userData={userData} posts={posts} setPosts={setPosts} />}
                            {activeTab === 'reminders' && <CareDashboardTab userData={userData} onUpdateUser={handleUpdateUser} posts={posts} />}
                            {activeTab === 'aivet' && <AIVetTab userData={userData} />}
                        </div>

                        <div className="md:hidden absolute bottom-0 w-full h-[90px] bg-white/95 backdrop-blur-md border-t-2 border-slate-200 flex justify-around items-center text-xs text-slate-400 z-30 pb-safe">
                            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center justify-center w-full h-full transition-all ${activeTab === 'home' ? 'text-[#1cb0f6] font-black' : 'font-extrabold'}`}><i className={`fa-solid fa-house text-[28px] mb-1.5 ${activeTab==='home'?'mb-2 bg-[#ddf4ff] p-2 rounded-xl border-2 border-[#1cb0f6] text-[#1cb0f6] animate-wiggle':''}`}></i>{activeTab!=='home' && '動態'}</button>
                            <button onClick={() => setActiveTab('reminders')} className={`flex flex-col items-center justify-center w-full h-full transition-all ${activeTab === 'reminders' ? 'text-[#1cb0f6] font-black' : 'font-extrabold'}`}><i className={`fa-solid fa-list-check text-[28px] mb-1.5 ${activeTab==='reminders'?'mb-2 bg-[#ddf4ff] p-2 rounded-xl border-2 border-[#1cb0f6] text-[#1cb0f6] animate-wiggle':''}`}></i>{activeTab!=='reminders' && '任務'}</button>
                            <button onClick={() => setActiveTab('aivet')} className={`flex flex-col items-center justify-center w-full h-full transition-all ${activeTab === 'aivet' ? 'text-[#1cb0f6] font-black' : 'font-extrabold'}`}><i className={`fa-solid fa-user-doctor text-[28px] mb-1.5 ${activeTab==='aivet'?'mb-2 bg-[#ddf4ff] p-2 rounded-xl border-2 border-[#1cb0f6] text-[#1cb0f6] animate-wiggle':''}`}></i>{activeTab!=='aivet' && '博士'}</button>
                        </div>
                    </div>

                    {showSettings && <SettingsModal userData={userData} onClose={() => setShowSettings(false)} onUpdateUser={handleUpdateUser} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
