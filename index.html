<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寵物每一天 Pro Max</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @media (max-width: 768px) { ::-webkit-scrollbar { display: none; } }
        .typing-dot { animation: typing 1.4s infinite ease-in-out; fill: currentColor; }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        .smooth-scroll { scroll-behavior: smooth; }
    </style>
</head>
<body class="h-screen w-screen m-0 overflow-hidden font-sans antialiased text-gray-800 bg-[#f8fafc]">
    <div id="root" class="w-full h-full flex relative overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const DB_KEY_USERS = 'petApp_v5_users'; 
        const DB_KEY_POSTS = 'petApp_v5_posts'; 
        const DB_KEY_AUTH = 'petApp_v5_auth';   
        const DB_KEY_CURRENT_USER = 'petApp_v5_currentUser'; 
        // 🌟 新增：專門用來存 API Key 的 LocalStorage Key
        const DB_KEY_API_TOKEN = 'petApp_v5_geminiToken';

        const defaultPosts = [
            { id: 2, author: 'LeoMom', avatar: '👩', petName: 'Leo', time: '1 小時前', timestamp: Date.now() - 3600000, content: '今天天氣超好，帶 Leo 去了寵物公園，結果牠交到了新朋友！跑了一下午回家直接秒睡 🤣', image: 'https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=500&q=80', likes: 12, likedByMe: false, comments: [{id: 1, author: '王大明', text: '太可愛了吧！'}] },
            { id: 1, author: 'CatLover99', avatar: '👨', petName: '咪咪', time: '3 小時前', timestamp: Date.now() - 10800000, content: '買了超貴的貓抓板給牠，結果牠只對旁邊的紙箱有興趣... 奴才心已死 💸', image: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=500&q=80', likes: 45, likedByMe: true, comments: [] }
        ];

        const speciesOptions = {
            '狗': ['米克斯 (混血/土狗)', '台灣犬', '柴犬', '貴賓犬', '法式鬥牛犬', '柯基', '黃金獵犬', '臘腸狗', '博美犬', '吉娃娃', '瑪爾濟斯', '邊境牧羊犬', '哈士奇', '拉布拉多', '薩摩耶', '雪納瑞', '其他 (請自行填寫)'],
            '貓': ['米克斯 (一般混血)', '三花貓', '橘貓', '賓士貓 (黑白貓)', '玳瑁貓', '黑貓', '白貓', '虎斑貓', '英國短毛貓', '美國短毛貓', '布偶貓', '曼赤肯 (短腿貓)', '緬因貓', '波斯貓', '俄羅斯藍貓', '暹羅貓', '其他 (請自行填寫)'],
            '鳥': ['玄鳳鸚鵡', '虎皮鸚鵡', '文鳥', '其他 (請自行填寫)'],
            '兔/鼠': ['侏儒兔', '垂耳兔', '天竺鼠', '黃金鼠', '其他 (請自行填寫)'],
            '爬蟲/其他': ['烏龜', '守宮', '蛇', '其他 (請自行填寫)']
        };

        const renderAvatar = (avatarStr, fallbackIcon = '👤') => {
            if(avatarStr && avatarStr.startsWith('data:image')) {
                return <img src={avatarStr} class="w-full h-full object-cover" />;
            }
            return <span class="flex items-center justify-center w-full h-full">{avatarStr || fallbackIcon}</span>;
        };

        // --- 登入畫面 ---
        const LoginScreen = ({ onLogin }) => {
            const [isLoginMode, setIsLoginMode] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');

            const handleAuth = () => {
                if (!email.trim() || !password.trim()) return alert('請完整輸入信箱與密碼！');
                const authDb = JSON.parse(localStorage.getItem(DB_KEY_AUTH)) || {};
                
                if (isLoginMode) {
                    if (!authDb[email]) return alert('找不到此信箱，請先註冊！');
                    if (authDb[email] !== password) return alert('密碼錯誤！');
                } else {
                    if (authDb[email]) return alert('此信箱已註冊，請直接登入。');
                    authDb[email] = password;
                    localStorage.setItem(DB_KEY_AUTH, JSON.stringify(authDb));
                }
                onLogin(email);
            };

            return (
                <div class="h-full w-full bg-gradient-to-br from-indigo-50 via-white to-blue-50 overflow-y-auto">
                    <div class="min-h-full flex flex-col items-center justify-center p-6 py-12">
                        <div class="text-center w-full max-w-sm mb-10 z-10">
                            <div class="text-6xl mb-6 text-indigo-500 shadow-2xl w-28 h-28 mx-auto bg-white rounded-[2rem] flex items-center justify-center transform rotate-3"><i class="fa-solid fa-paw"></i></div>
                            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">寵物每一天</h1>
                            <p class="text-sm text-gray-500 mt-3 font-medium">不只紀錄，更是毛孩專屬的健康管家</p>
                        </div>
                        <div class="bg-white w-full max-w-sm p-8 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-50 z-10">
                            <div class="flex justify-center gap-8 mb-8 border-b border-gray-100 pb-4">
                                <button onClick={() => setIsLoginMode(true)} class={`font-bold text-lg pb-4 -mb-4 transition-all ${isLoginMode ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-gray-400 hover:text-gray-600'}`}>登入</button>
                                <button onClick={() => setIsLoginMode(false)} class={`font-bold text-lg pb-4 -mb-4 transition-all ${!isLoginMode ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-gray-400 hover:text-gray-600'}`}>註冊</button>
                            </div>
                            <div class="space-y-5">
                                <div>
                                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">電子信箱</label>
                                    <input type="email" class="w-full bg-gray-50 border-transparent p-4 rounded-2xl focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all" placeholder="name@example.com" value={email} onChange={e => setEmail(e.target.value)} />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">密碼</label>
                                    <input type="password" class="w-full bg-gray-50 border-transparent p-4 rounded-2xl focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all" placeholder="輸入密碼" value={password} onChange={e => setPassword(e.target.value)} onKeyPress={e => e.key === 'Enter' && handleAuth()} />
                                </div>
                                <button onClick={handleAuth} class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl hover:bg-indigo-700 shadow-[0_8px_20px_rgba(79,70,229,0.3)] transform hover:-translate-y-1 transition-all mt-4">
                                    {isLoginMode ? '進入系統' : '完成註冊'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 寵物表單 ---
        const PetForm = ({ initialData, onSave, onCancel, isNewUser }) => {
            const [formData, setFormData] = useState(initialData || { id: Date.now(), name: '', species: '狗', breed: speciesOptions['狗'][0], customBreed: '', gender: '男', isNeutered: '未絕育', status: '活潑健康' });
            
            const submit = () => {
                if (!formData.name.trim()) return alert('請填寫寵物名字！');
                const finalBreed = formData.breed.includes('其他') ? formData.customBreed : formData.breed;
                if (!finalBreed.trim()) return alert('請填寫品種！');
                onSave({ ...formData, breed: finalBreed });
            };

            return (
                <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-gray-50 max-w-md w-full mx-auto">
                    <h2 class="text-2xl font-bold text-center mb-8 text-gray-800">{isNewUser ? '建立第一隻寵物' : '編輯寵物資料'}</h2>
                    <div class="space-y-5">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-2 uppercase">名字</label>
                            <input type="text" class="w-full bg-gray-50 p-3.5 rounded-xl focus:bg-white border-transparent focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} placeholder="例如：毛毛" />
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase">物種</label>
                                <select class="w-full bg-gray-50 p-3.5 rounded-xl border-transparent focus:border-indigo-500 outline-none" value={formData.species} onChange={e => setFormData({...formData, species: e.target.value, breed: speciesOptions[e.target.value][0], customBreed: ''})}>
                                    {Object.keys(speciesOptions).map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase">品種</label>
                                <select class="w-full bg-gray-50 p-3.5 rounded-xl border-transparent focus:border-indigo-500 outline-none" value={formData.breed} onChange={e => setFormData({...formData, breed: e.target.value})}>
                                    {speciesOptions[formData.species].map(b => <option key={b} value={b}>{b}</option>)}
                                </select>
                            </div>
                        </div>
                        {formData.breed.includes('其他') && (
                            <input type="text" class="w-full bg-gray-50 p-3.5 rounded-xl outline-none focus:ring-2 focus:ring-indigo-200" value={formData.customBreed} onChange={e => setFormData({...formData, customBreed: e.target.value})} placeholder="請輸入品種" />
                        )}
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase">性別</label>
                                <select class="w-full bg-gray-50 p-3.5 rounded-xl outline-none" value={formData.gender} onChange={e => setFormData({...formData, gender: e.target.value})}><option value="男">男生</option><option value="女">女生</option></select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase">絕育狀態</label>
                                <select class="w-full bg-gray-50 p-3.5 rounded-xl outline-none" value={formData.isNeutered} onChange={e => setFormData({...formData, isNeutered: e.target.value})}><option value="未絕育">未絕育</option><option value="已絕育">已絕育</option></select>
                            </div>
                        </div>
                        <div class="pt-4 flex gap-3">
                            {onCancel && <button onClick={onCancel} class="flex-1 bg-gray-100 text-gray-600 font-bold py-3.5 rounded-xl hover:bg-gray-200 transition-colors">取消</button>}
                            <button onClick={submit} class="flex-1 bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 shadow-md transition-colors">儲存檔案</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 設定 Modal (🌟 加入 API Key 設定欄位) ---
        const SettingsModal = ({ userData, onClose, onUpdateUser }) => {
            const [name, setName] = useState(userData.name);
            const [avatar, setAvatar] = useState(userData.avatar);
            const [editingPet, setEditingPet] = useState(null);
            const [apiKey, setApiKey] = useState(localStorage.getItem(DB_KEY_API_TOKEN) || ''); // 讀取/設定 API Key
            const avatarInputRef = useRef(null);

            const handleSave = () => { 
                onUpdateUser({ ...userData, name, avatar }); 
                localStorage.setItem(DB_KEY_API_TOKEN, apiKey); // 儲存 API Key
                onClose(); 
            };

            if (editingPet) return <div class="absolute inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4"><PetForm initialData={editingPet} onSave={(updatedPet) => { onUpdateUser({ ...userData, pets: userData.pets.map(p => p.id === updatedPet.id ? updatedPet : p) }); setEditingPet(null); }} onCancel={() => setEditingPet(null)} /></div>;

            return (
                <div class="absolute inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-[2rem] overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                        <div class="p-6 flex justify-between items-center bg-gray-50/50">
                            <h3 class="font-bold text-xl text-gray-800">個人與系統設定</h3>
                            <button onClick={onClose} class="text-gray-400 hover:text-red-500 bg-white w-8 h-8 rounded-full shadow-sm flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="p-6 overflow-y-auto flex-1">
                            <h4 class="text-xs font-bold text-gray-400 mb-4 uppercase tracking-wider">主人資料</h4>
                            <div class="flex items-center gap-5 mb-8 bg-gray-50 p-4 rounded-2xl">
                                <div class="relative w-20 h-20 rounded-[1.5rem] overflow-hidden border-4 border-white shadow-md bg-indigo-50 cursor-pointer group flex-shrink-0" onClick={() => avatarInputRef.current.click()}>
                                    {renderAvatar(avatar)}
                                    <div class="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-solid fa-camera text-white"></i></div>
                                </div>
                                <input type="file" accept="image/*" class="hidden" ref={avatarInputRef} onChange={e => {
                                    if (e.target.files[0]) { const reader = new FileReader(); reader.onloadend = () => setAvatar(reader.result); reader.readAsDataURL(e.target.files[0]); }
                                }} />
                                <div class="flex-1">
                                    <label class="block text-xs font-bold text-gray-500 mb-1">顯示名稱</label>
                                    <input type="text" class="w-full border-none bg-white shadow-sm p-3 rounded-xl outline-none focus:ring-2 focus:ring-indigo-100" value={name} onChange={e => setName(e.target.value)} />
                                </div>
                            </div>
                            
                            {/* 🌟 新增的 API Key 設定區塊 */}
                            <h4 class="text-xs font-bold text-gray-400 mb-4 uppercase tracking-wider flex justify-between">
                                <span>AI 診斷引擎設定</span>
                                <a href="https://aistudio.google.com/" target="_blank" class="text-indigo-500 hover:underline">取得 Key</a>
                            </h4>
                            <div class="mb-8 bg-indigo-50 p-4 rounded-2xl">
                                <label class="block text-xs font-bold text-indigo-700 mb-2">Gemini API Key (本機安全儲存)</label>
                                <input type="password" class="w-full border-none bg-white shadow-sm p-3 rounded-xl outline-none focus:ring-2 focus:ring-indigo-300 text-sm" placeholder="AIzaSy..." value={apiKey} onChange={e => setApiKey(e.target.value)} />
                                <p class="text-[10px] text-indigo-500 mt-2 leading-relaxed">此金鑰僅會儲存在您的瀏覽器本地端，不會上傳至任何伺服器。若要使用 AI 急診室的影像分析功能，請填寫有效金鑰。</p>
                            </div>

                            <h4 class="text-xs font-bold text-gray-400 mb-4 uppercase tracking-wider">管理寵物</h4>
                            <div class="space-y-3">
                                {userData.pets.map(p => (
                                    <div key={p.id} class="bg-white border border-gray-100 rounded-2xl p-4 flex justify-between items-center shadow-sm hover:shadow-md transition-shadow">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-500 flex items-center justify-center">{p.species === '貓'?'🐱':p.species === '狗'?'🐶':'🐾'}</div>
                                            <div>
                                                <p class="font-bold text-gray-800">{p.name}</p>
                                                <p class="text-xs text-gray-400 mt-0.5">{p.breed} · {p.gender}</p>
                                            </div>
                                        </div>
                                        <button onClick={() => setEditingPet(p)} class="text-indigo-600 font-bold bg-indigo-50 px-4 py-2 rounded-xl text-sm hover:bg-indigo-100">編輯</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div class="p-6 border-t border-gray-50 bg-white">
                            <button onClick={handleSave} class="w-full bg-indigo-900 text-white font-bold py-4 rounded-2xl hover:bg-indigo-800 shadow-lg transition-transform hover:-translate-y-0.5">儲存所有設定</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 動態牆 ---
        const HomeTab = ({ userData, posts, setPosts }) => {
            const [inputText, setInputText] = useState('');
            const [imagePreview, setImagePreview] = useState(null);
            const [selectedPetId, setSelectedPetId] = useState(userData.pets[0]?.id);
            const [now, setNow] = useState(Date.now());
            const fileInputRef = useRef(null);

            useEffect(() => { const timer = setInterval(() => setNow(Date.now()), 60000); return () => clearInterval(timer); }, []);

            const handlePublish = () => {
                if (!inputText.trim() && !imagePreview) return;
                const pet = userData.pets.find(p => p.id === selectedPetId);
                const newPost = { 
                    id: Date.now(), author: userData.name, avatar: userData.avatar, petName: pet.name, 
                    time: '剛剛', timestamp: Date.now(), content: inputText, image: imagePreview, likes: 0, likedByMe: false, comments: []
                };
                const updated = [newPost, ...posts];
                setPosts(updated);
                localStorage.setItem(DB_KEY_POSTS, JSON.stringify(updated));
                setInputText(''); setImagePreview(null);
            };

            const toggleLike = (postId) => {
                const updated = posts.map(p => p.id === postId ? { ...p, likes: p.likedByMe ? p.likes - 1 : p.likes + 1, likedByMe: !p.likedByMe } : p);
                setPosts(updated); localStorage.setItem(DB_KEY_POSTS, JSON.stringify(updated));
            };

            const getRelativeTime = (ts) => {
                if (!ts) return '稍早';
                const diff = Math.floor((now - ts) / 1000);
                if (diff < 60) return '剛剛';
                if (diff < 3600) return `${Math.floor(diff / 60)} 分鐘前`;
                if (diff < 86400) return `${Math.floor(diff / 3600)} 小時前`;
                return `${Math.floor(diff / 86400)} 天前`;
            };

            return (
                <div class="p-4 md:p-8 overflow-y-auto h-full pb-24 md:pb-8 smooth-scroll">
                    <h2 class="text-3xl font-extrabold mb-6 text-gray-900 tracking-tight">社群動態</h2>
                    
                    <div class="bg-white p-5 rounded-[2rem] mb-8 shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-gray-100">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-indigo-50 bg-gray-50 flex-shrink-0">{renderAvatar(userData.avatar)}</div>
                            <div class="flex-1 bg-gray-50 rounded-xl px-3 py-1 flex items-center">
                                <span class="text-sm text-gray-500 mr-2">主角是：</span>
                                <select class="bg-transparent text-indigo-700 font-bold outline-none flex-1 py-1" value={selectedPetId} onChange={e => setSelectedPetId(Number(e.target.value))}>
                                    {userData.pets.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                </select>
                            </div>
                        </div>
                        <textarea class="w-full p-2 border-none bg-transparent text-base focus:ring-0 outline-none resize-none" rows="2" placeholder="分享今天的趣事..." value={inputText} onChange={e => setInputText(e.target.value)}></textarea>
                        
                        {imagePreview && (
                            <div class="relative mb-3 inline-block w-full">
                                <img src={imagePreview} class="w-full h-auto max-h-[300px] object-contain bg-gray-50 rounded-xl shadow-sm border border-gray-100" />
                                <button onClick={() => setImagePreview(null)} class="absolute top-2 right-2 bg-gray-900/70 text-white rounded-full w-8 h-8 flex items-center justify-center backdrop-blur-sm hover:bg-red-500 transition-colors"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        )}
                        <div class="flex justify-between items-center mt-2 pt-3 border-t border-gray-50">
                            <input type="file" accept="image/*" class="hidden" ref={fileInputRef} onChange={e => {
                                if (e.target.files[0]) { const reader = new FileReader(); reader.onloadend = () => setImagePreview(reader.result); reader.readAsDataURL(e.target.files[0]); }
                            }} />
                            <button onClick={() => fileInputRef.current.click()} class="text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-colors">
                                <i class="fa-solid fa-image text-lg"></i> 加入照片
                            </button>
                            <button onClick={handlePublish} class="bg-indigo-600 text-white px-8 py-2.5 rounded-full text-sm font-bold shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all">發布</button>
                        </div>
                    </div>

                    <div class="space-y-6">
                        {posts.map(post => (
                            <div key={post.id} class="bg-white rounded-[2rem] p-5 shadow-[0_2px_15px_rgb(0,0,0,0.02)] border border-gray-100">
                                <div class="flex items-center mb-4">
                                    <div class="w-12 h-12 rounded-full overflow-hidden mr-3 bg-gray-50 border border-gray-100">{renderAvatar(post.avatar)}</div>
                                    <div>

        };

        // --- 健康與提醒 ---
        const CareDashboardTab = ({ userData, onUpdateUser, posts }) => {
            const [reminders, setReminders] = useState(userData.customReminders || []);
            const [newReminderData, setNewReminderData] = useState({});

            const getBreedRecommendation = (pet) => {
                const b = pet.breed || '';
                if (b.includes('鬥牛') || b.includes('巴哥') || b.includes('短吻')) return { name: '透氣防衝撞胸背帶', desc: '短吻犬呼吸道較短，使用胸背帶可大幅降低頸部壓力。', tag: '短吻護理', icon: 'fa-vest', color: 'from-purple-500 to-indigo-500', bg: 'bg-purple-50' };
                if (b.includes('柯基') || b.includes('臘腸')) return { name: '寵物護脊斜坡階梯', desc: '短腿犬脊椎負擔大，請絕對避免讓牠們頻繁跳躍沙發或上下樓梯。', tag: '護脊關鍵', icon: 'fa-stairs', color: 'from-orange-500 to-red-500', bg: 'bg-orange-50' };
                if (b.includes('哈士奇') || b.includes('邊境') || b.includes('柴犬')) return { name: '高難度益智漏食玩具', desc: '高智商且精力旺盛，需要大量益智遊戲消耗腦力，避免拆家。', tag: '精力消耗', icon: 'fa-puzzle-piece', color: 'from-red-500 to-pink-500', bg: 'bg-red-50' };
                if (b.includes('橘貓') || b.includes('胖')) return { name: '低碳水體重控制糧', desc: '十隻橘貓九隻胖，為了保護關節與心血管健康，請嚴格控管熱量！', tag: '易胖體質', icon: 'fa-weight-scale', color: 'from-amber-400 to-orange-500', bg: 'bg-amber-50' };
                if (b.includes('英國短毛') || b.includes('波斯')) return { name: '專業化毛粉與勤梳毛', desc: '毛髮濃密，換季時需加強排毛，避免引發毛球症影響食慾。', tag: '腸胃健康', icon: 'fa-seedling', color: 'from-green-400 to-emerald-500', bg: 'bg-green-50' };
                
                return pet.species === '貓' 
                    ? { name: '嚴選凍乾主食餐 / 鮮肉罐', desc: '符合貓咪純肉食天性，增加水分攝取並維持優良肌肉量。', tag: '優質蛋白', icon: 'fa-fish', color: 'from-blue-400 to-cyan-500', bg: 'bg-blue-50' }
                    : { name: '全效型綜合維他命', desc: '補充日常所需微量元素，維持毛髮亮麗與增強免疫力。', tag: '日常保健', icon: 'fa-pills', color: 'from-indigo-400 to-blue-500', bg: 'bg-indigo-50' };
            };

            const addReminder = (petId) => {
                const data = newReminderData[petId];
                if(!data || !data.text?.trim() || !data.date) return alert('請填寫提醒事項與日期！');
                const updated = [...reminders, { id: Date.now(), petId, text: data.text, targetDate: data.date, completed: false }];
                setReminders(updated);
                onUpdateUser({...userData, customReminders: updated});
                setNewReminderData({...newReminderData, [petId]: { text: '', date: '' }});
            };

            const toggleCompleted = (id) => {
                const updated = reminders.map(r => r.id === id ? { ...r, completed: !r.completed } : r);
                setReminders(updated); onUpdateUser({...userData, customReminders: updated});
            };

            const isTodayOrOverdue = (dateString) => {
                if (!dateString) return false;
                const today = new Date(); today.setHours(0,0,0,0);
                return new Date(dateString) <= today;
            };

            const hasPostedToday = (petName) => {
                const todayStr = new Date().toDateString();
                return posts.some(p => p.author === userData.name && p.petName === petName && new Date(p.timestamp).toDateString() === todayStr);
            };

            return (
                <div class="p-4 md:p-8 overflow-y-auto h-full pb-24 md:pb-8 smooth-scroll space-y-8">
                    <div>
                        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">健康與提醒</h2>
                        <p class="text-sm text-gray-500 mt-2">為每個毛孩量身打造的照護看板</p>
                    </div>

                    {userData.pets.map(pet => {
                        const rec = getBreedRecommendation(pet);
                        const petReminders = reminders.filter(r => r.petId === pet.id);
                        const urgentCount = petReminders.filter(r => !r.completed && isTodayOrOverdue(r.targetDate)).length;
                        const noPostToday = !hasPostedToday(pet.name);
                        
                        const showWarning = (pet.gender === '女' && pet.isNeutered === '未絕育') || noPostToday || urgentCount > 0;

                        return (
                            <div key={pet.id} class="bg-white rounded-[2.5rem] p-6 md:p-8 shadow-[0_10px_40px_-10px_rgba(0,0,0,0.05)] border border-gray-100/50">
                                <div class="flex items-center gap-4 mb-6">
                                    <div class="w-16 h-16 rounded-[1.2rem] bg-indigo-50 text-indigo-500 flex items-center justify-center text-3xl shadow-inner">
                                        {pet.species === '貓'?'🐱':pet.species === '狗'?'🐶':'🐾'}
                                    </div>
                                    <div>
                                        <h3 class="text-2xl font-bold text-gray-900">{pet.name}</h3>
                                        <p class="text-sm font-medium text-gray-400 mt-1">{pet.breed} · {pet.gender} ({pet.isNeutered})</p>
                                    </div>
                                </div>

                                <div class={`relative overflow-hidden rounded-2xl p-5 mb-6 text-white bg-gradient-to-r ${rec.color} shadow-md`}>
                                    <div class="relative z-10">
                                        <div class="flex justify-between items-start mb-2">
                                            <p class="text-xs font-bold uppercase tracking-wider text-white/80"><i class="fa-solid fa-sparkles mr-1"></i> 品種專屬指南</p>
                                            <span class="text-[10px] bg-white/20 px-2 py-1 rounded-md font-bold backdrop-blur-sm">{rec.tag}</span>
                                        </div>
                                        <p class="font-bold text-lg mb-1">{rec.name}</p>
                                        <p class="text-sm text-white/90 leading-relaxed">{rec.desc}</p>
                                    </div>
                                    <i class={`fa-solid ${rec.icon} absolute -right-4 -bottom-4 text-7xl opacity-10 transform -rotate-12`}></i>
                                </div>

                                {showWarning && (
                                    <div class="space-y-2 mb-6">
                                        {pet.gender === '女' && pet.isNeutered === '未絕育' && (
                                            <div class="bg-pink-50 border-l-4 border-pink-500 p-4 rounded-r-xl">
                                                <p class="text-sm font-bold text-pink-700"><i class="fa-solid fa-heart mr-2"></i> 生理期預警：請留意情緒與清潔。</p>
                                            </div>
                                        )}
                                        {noPostToday && (
                                            <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-xl">
                                                <p class="text-sm font-bold text-amber-700"><i class="fa-regular fa-clock mr-2"></i> 今日尚未紀錄：去動態牆分享一下 {pet.name} 今天的狀況吧！</p>
                                            </div>
                                        )}
                                        {urgentCount > 0 && (
                                            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-xl">
                                                <p class="text-sm font-bold text-red-700"><i class="fa-solid fa-triangle-exclamation mr-2"></i> 待辦逾期：有 {urgentCount} 項任務需要盡快完成！</p>
                                            </div>
                                        )}
                                    </div>
                                )}

                                <div class="bg-gray-50/50 rounded-2xl p-5 border border-gray-100">
                                    <h4 class="text-sm font-bold text-gray-800 mb-4 flex items-center"><i class="fa-solid fa-list-check mr-2 text-indigo-500"></i> 日常代辦清單</h4>
                                    
                                    <div class="space-y-2 mb-4">
                                        {petReminders.length === 0 ? <p class="text-xs text-gray-400 text-center py-2">目前無待辦事項</p> : 
                                            petReminders.sort((a, b) => (a.completed === b.completed ? 0 : a.completed ? 1 : -1)).map(r => {
                                                const urgent = !r.completed && isTodayOrOverdue(r.targetDate);
                                                return (
                                                    <div key={r.id} class={`bg-white p-3.5 rounded-xl shadow-sm border ${r.completed ? 'border-transparent opacity-60' : urgent ? 'border-red-200' : 'border-gray-100'} flex justify-between items-center transition-all`}>
                                                        <div class="flex items-center gap-3">
                                                            <div class={`w-6 h-6 rounded-full border-2 flex items-center justify-center cursor-pointer transition-colors ${r.completed ? 'bg-indigo-500 border-indigo-500' : 'border-gray-300 hover:border-indigo-400'}`} onClick={() => toggleCompleted(r.id)}>
                                                                {r.completed && <i class="fa-solid fa-check text-white text-xs"></i>}
                                                            </div>
                                                            <div>
                                                                <p class={`text-sm font-bold ${r.completed ? 'text-gray-400 line-through' : 'text-gray-800'}`}>{r.text}</p>
                                                                <p class={`text-[10px] font-bold mt-0.5 ${urgent ? 'text-red-500' : 'text-gray-400'}`}><i class="fa-regular fa-calendar mr-1"></i> {r.targetDate}</p>
                                                            </div>
                                                        </div>
                                                        <button onClick={() => {
                                                            const updated = reminders.filter(item => item.id !== r.id);
                                                            setReminders(updated); onUpdateUser({...userData, customReminders: updated});
                                                        }} class="text-gray-300 hover:text-red-500 px-2 transition-colors"><i class="fa-solid fa-trash-can"></i></button>
                                                    </div>
                                                )
                                            })
                                        }
                                    </div>

                                    <div class="flex flex-col md:flex-row gap-2 mt-4 pt-4 border-t border-gray-200/60">
                                        <input type="text" class="flex-1 bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" placeholder="例如：餵心絲蟲藥..." 
                                            value={newReminderData[pet.id]?.text || ''} onChange={e => setNewReminderData({...newReminderData, [pet.id]: { ...newReminderData[pet.id], text: e.target.value }})} />
                                        <div class="flex gap-2">
                                            <input type="date" class="flex-1 md:w-36 bg-white border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none text-gray-600 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" 
                                                value={newReminderData[pet.id]?.date || ''} onChange={e => setNewReminderData({...newReminderData, [pet.id]: { ...newReminderData[pet.id], date: e.target.value }})} />
                                            <button onClick={() => addReminder(pet.id)} class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-indigo-700 shadow-sm transition-colors whitespace-nowrap">新增</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        };

        // --- AI 急診 (🌟 實裝 Gemini API 智慧攔截與讀取機制) ---
        const AIVetTab = ({ userData }) => {
            const [messages, setMessages] = useState([{ sender: 'bot', text: `你好！我是急診助手。請問是哪一隻毛孩怎麼了？請描述症狀，必要時可上傳照片讓我幫您分析。` }]);
            const [input, setInput] = useState('');
            const [imageAttachment, setImageAttachment] = useState(null); 
            const [isTyping, setIsTyping] = useState(false);
            const chatEndRef = useRef(null);
            const fileInputRef = useRef(null);

            // 🌟 呼叫 Google Gemini API
            const callGeminiAPI = async (userText, imageBase64) => {
                // 從 LocalStorage 讀取使用者輸入的 API Key
                const GEMINI_API_KEY = localStorage.getItem(DB_KEY_API_TOKEN);

                if (!GEMINI_API_KEY) {
                    return `⚠️ 【系統提示】：您尚未設定 API Key！\n\n因為專案開源在 GitHub，直接放入金鑰會有被盜用的風險。請點擊左側「管理設定」，在「AI 診斷引擎設定」中輸入您的 Gemini API Key 來解鎖真正的 AI 功能！`;
                }

                const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                const petsInfo = userData?.pets?.map(p => `- ${p.name} (${p.species}, ${p.breed}, ${p.gender}, ${p.isNeutered})`).join('\n') || '無詳細資料';

                const promptText = `你是一位專業、親切且有同理心的獸醫急診助手。
使用者擁有的毛孩檔案：
${petsInfo}

使用者諮詢描述：${userText || '（使用者未填寫文字，主要上傳了圖片）'}

請遵循以下要求：
1. 語氣專業、貼心且簡明扼要。
2. ⚠️ 【安全護欄】：若從圖片或文字中發現嚴重症狀（如出血、劇烈嘔吐、昏迷、呼吸困難等），請在最開頭用【⚠️ 立即送醫提示】警示主人。
3. 若有照片，請結合照片細節給出初步觀察建議。`;

                const parts = [];
                if (imageBase64) {
                    const base64Data = imageBase64.split(',')[1];
                    const mimeType = imageBase64.substring(imageBase64.indexOf(":") + 1, imageBase64.indexOf(";"));
                    parts.push({ inline_data: { mime_type: mimeType, data: base64Data } });
                }
                parts.push({ text: promptText });

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts }] })
                    });
                    const data = await response.json();
                    
                    if (data.error) {
                         return `❌ API 發生錯誤：${data.error.message}。\n請檢查您的 API Key 是否正確。`;
                    }
                    if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                        return data.candidates[0].content.parts[0].text;
                    }
                    return "AI 響應異常，請稍後再試。";
                } catch (err) {
                    console.error("Gemini API Error:", err);
                    return "連接 Gemini API 失敗，請檢查網路連線。";
                }
            };

            const handleSend = async () => {
                if (!input.trim() && !imageAttachment) return;
                
                const userText = input.trim();
                const currentImg = imageAttachment;

                setInput('');
                setImageAttachment(null);

                const newMsgs = [...messages, { sender: 'user', text: userText, image: currentImg }];
                setMessages(newMsgs);
                setIsTyping(true);

                // 呼叫真實的 Gemini API
                const botReply = await callGeminiAPI(userText, currentImg);
                
                setIsTyping(false);
                setMessages([...newMsgs, { sender: 'bot', text: botReply }]);
            };

            useEffect(() => chatEndRef.current?.scrollIntoView({ behavior: "smooth" }), [messages, isTyping]);

            return (
                <div class="flex flex-col h-full bg-white pb-[70px] md:pb-0 relative">
                    <div class="bg-gradient-to-r from-indigo-600 to-blue-500 text-white p-5 shadow-md z-10 shrink-0">
                        <h2 class="text-lg font-bold flex items-center"><i class="fa-solid fa-stethoscope mr-2 text-2xl"></i> AI 急診室</h2>
                        <p class="text-xs text-indigo-100 mt-1">請在設定中輸入 Gemini API Key 以啟用完整影像識別功能</p>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 bg-gray-50/50">
                        {messages.map((msg, idx) => (
                            <div key={idx} class={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div class={`max-w-[85%] p-4 rounded-2xl text-[15px] whitespace-pre-wrap shadow-sm leading-relaxed ${msg.sender === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white text-gray-800 border border-gray-100 rounded-bl-none'}`}>
                                    {msg.image && <img src={msg.image} class="w-full max-w-[280px] h-auto object-contain rounded-xl mb-3 shadow-sm bg-black/5" />}
                                    {msg.text}
                                </div>
                            </div>
                        ))}
                        {isTyping && (
                            <div class="flex justify-start"><div class="bg-white border border-gray-100 p-4 rounded-2xl rounded-bl-none shadow-sm flex gap-1.5"><svg height="8" width="8" class="typing-dot text-gray-400"><circle cx="4" cy="4" r="4"/></svg><svg height="8" width="8" class="typing-dot text-gray-400"><circle cx="4" cy="4" r="4"/></svg><svg height="8" width="8" class="typing-dot text-gray-400"><circle cx="4" cy="4" r="4"/></svg></div></div>
                        )}
                        <div ref={chatEndRef} class="h-2"></div>
                    </div>

                    <div class="p-4 bg-white border-t border-gray-100 flex flex-col gap-2 shrink-0 z-10 absolute md:relative bottom-0 w-full">
                        {imageAttachment && (
                            <div class="relative inline-block w-24 h-24 mb-1">
                                <img src={imageAttachment} class="w-24 h-24 object-cover rounded-xl border-2 border-indigo-200 shadow-sm" />
                                <button onClick={() => setImageAttachment(null)} class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-md"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        )}
                        
                        <div class="flex gap-3 items-center w-full">
                            <input type="file" accept="image/*" class="hidden" ref={fileInputRef} onChange={e => {
                                if(e.target.files[0]) {
                                    const reader = new FileReader();
                                    reader.onloadend = () => setImageAttachment(reader.result);
                                    reader.readAsDataURL(e.target.files[0]);
                                }
                            }} />
                            <button onClick={() => fileInputRef.current.click()} class="text-gray-400 hover:text-indigo-600 p-2 text-2xl transition-colors"><i class="fa-solid fa-circle-plus"></i></button>
                            <input type="text" class="flex-1 bg-gray-100 border-none rounded-full px-5 py-3.5 text-sm outline-none focus:ring-2 focus:ring-indigo-300 transition-shadow" placeholder="描述症狀..." value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleSend()} disabled={isTyping} />
                            <button onClick={handleSend} disabled={isTyping || (!input.trim() && !imageAttachment)} class={`w-12 h-12 rounded-full flex items-center justify-center text-lg shadow-lg transition-transform ${(!input.trim() && !imageAttachment) || isTyping ? 'bg-gray-200 text-gray-400' : 'bg-indigo-600 text-white hover:scale-105'}`}><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 核心架構 ---
        const App = () => {
            const [currentUser, setCurrentUser] = useState(localStorage.getItem(DB_KEY_CURRENT_USER));
            const [userData, setUserData] = useState(null); 
            const [activeTab, setActiveTab] = useState('home');
            const [posts, setPosts] = useState([]);
            const [showSettings, setShowSettings] = useState(false);
            const [isAddingPet, setIsAddingPet] = useState(false);

            useEffect(() => {
                const savedPosts = JSON.parse(localStorage.getItem(DB_KEY_POSTS));
                if (savedPosts && savedPosts.length > 0) setPosts(savedPosts);
                else { setPosts(defaultPosts); localStorage.setItem(DB_KEY_POSTS, JSON.stringify(defaultPosts)); }

                if (currentUser) {
                    const usersDb = JSON.parse(localStorage.getItem(DB_KEY_USERS)) || {};
                    if (usersDb[currentUser]?.pets?.length > 0) setUserData(usersDb[currentUser]);
                }
            }, [currentUser]);

            const handleLogin = (email) => {
                localStorage.setItem(DB_KEY_CURRENT_USER, email); setCurrentUser(email);
                const usersDb = JSON.parse(localStorage.getItem(DB_KEY_USERS)) || {};
                setUserData(usersDb[email]?.pets?.length > 0 ? usersDb[email] : null);
            };

            const handleUpdateUser = (newData) => {
                const usersDb = JSON.parse(localStorage.getItem(DB_KEY_USERS)) || {};
                usersDb[currentUser] = newData; localStorage.setItem(DB_KEY_USERS, JSON.stringify(usersDb));
                setUserData(newData);
            };

            const handleLogout = () => { localStorage.removeItem(DB_KEY_CURRENT_USER); setCurrentUser(null); setUserData(null); };

            if (!currentUser) return <LoginScreen onLogin={handleLogin} />;
            if (!userData) return <div class="h-full w-full bg-gradient-to-br from-indigo-50 to-blue-50 flex items-center justify-center p-4 overflow-y-auto"><PetForm onSave={pet => handleUpdateUser({ name: currentUser.split('@')[0], avatar: '👤', pets: [pet], customReminders: [] })} isNewUser={true} /></div>;
            if (isAddingPet) return <div class="h-full w-full bg-gradient-to-br from-indigo-50 to-blue-50 flex items-center justify-center p-4 overflow-y-auto"><PetForm onSave={pet => { handleUpdateUser({ ...userData, pets: [...userData.pets, pet] }); setIsAddingPet(false); }} onCancel={() => setIsAddingPet(false)} /></div>;

            return (
                <div class="flex h-full w-full bg-[#f8fafc] overflow-hidden relative">
                    
                    {/* 左側 Sidebar (電腦版) */}
                    <div class="hidden md:flex flex-col w-[280px] bg-white border-r border-gray-100 z-10 h-full">
                        <div class="p-8">
                            <div class="flex items-center gap-4 mb-8">
                                <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-indigo-50 bg-gray-50 flex-shrink-0">{renderAvatar(userData.avatar)}</div>
                                <div class="overflow-hidden">
                                    <p class="font-extrabold text-lg text-gray-900 truncate">{userData.name}</p>
                                    <p class="text-[11px] text-gray-400 font-medium mt-0.5 truncate">{currentUser}</p>
                                </div>
                            </div>
                            
                            <div class="space-y-2 mb-8">
                                <button onClick={() => setActiveTab('home')} class={`w-full text-left p-4 rounded-2xl font-bold flex items-center gap-4 transition-all ${activeTab==='home'?'bg-indigo-600 text-white shadow-md':'text-gray-500 hover:bg-gray-50 hover:text-gray-900'}`}><i class="fa-solid fa-house text-lg w-6"></i> 動態牆</button>
                                <button onClick={() => setActiveTab('reminders')} class={`w-full text-left p-4 rounded-2xl font-bold flex items-center gap-4 transition-all ${activeTab==='reminders'?'bg-indigo-600 text-white shadow-md':'text-gray-500 hover:bg-gray-50 hover:text-gray-900'}`}><i class="fa-solid fa-heart-pulse text-lg w-6"></i> 健康與提醒</button>
                                <button onClick={() => setActiveTab('aivet')} class={`w-full text-left p-4 rounded-2xl font-bold flex items-center gap-4 transition-all ${activeTab==='aivet'?'bg-indigo-600 text-white shadow-md':'text-gray-500 hover:bg-gray-50 hover:text-gray-900'}`}><i class="fa-solid fa-stethoscope text-lg w-6"></i> AI 急診</button>
                            </div>

                            <div class="pt-6 border-t border-gray-100 space-y-3">
                                <button onClick={() => setShowSettings(true)} class="w-full py-3 bg-gray-50 text-gray-600 font-bold rounded-xl hover:bg-gray-100 transition-colors text-sm flex justify-center items-center"><i class="fa-solid fa-gear mr-2"></i> 管理設定</button>
                                <button onClick={() => setIsAddingPet(true)} class="w-full py-3 bg-indigo-50 text-indigo-600 font-bold rounded-xl hover:bg-indigo-100 transition-colors text-sm flex justify-center items-center"><i class="fa-solid fa-plus mr-2"></i> 新增寵物</button>
                            </div>
                        </div>
                        <div class="mt-auto p-6">
                            <button onClick={handleLogout} class="w-full py-3 text-red-500 font-bold rounded-xl hover:bg-red-50 transition-colors text-sm"><i class="fa-solid fa-right-from-bracket mr-2"></i> 登出</button>
                        </div>
                    </div>

                    {/* 右側主內容區 */}
                    <div class="flex-1 flex flex-col relative w-full h-full overflow-hidden">
                        
                        {/* 手機版頂部 */}
                        <div class="md:hidden h-16 bg-white/80 backdrop-blur-md flex items-center justify-between px-6 border-b border-gray-100 shrink-0 z-20">
                            <div class="font-extrabold text-lg text-indigo-600 tracking-tight flex items-center gap-2"><i class="fa-solid fa-paw"></i> 寵物每一天</div>
                            <button onClick={() => setShowSettings(true)} class="w-8 h-8 rounded-full overflow-hidden border border-gray-200">{renderAvatar(userData.avatar)}</button>
                        </div>

                        {/* 主要渲染區域 */}
                        <div class="flex-1 overflow-hidden relative">
                            {activeTab === 'home' && <HomeTab userData={userData} posts={posts} setPosts={setPosts} />}
                            {activeTab === 'reminders' && <CareDashboardTab userData={userData} onUpdateUser={handleUpdateUser} posts={posts} />}
                            {activeTab === 'aivet' && <AIVetTab userData={userData} />}
                        </div>

                        {/* 手機版底部導航 */}
                        <div class="md:hidden absolute bottom-0 w-full h-[80px] pb-safe bg-white border-t border-gray-100 flex justify-around items-center text-xs text-gray-400 z-20">
                            <button onClick={() => setActiveTab('home')} class={`flex flex-col items-center justify-center w-full h-full transition-colors ${activeTab === 'home' ? 'text-indigo-600 font-bold' : 'hover:text-gray-600'}`}><i class={`fa-solid fa-house text-xl mb-1.5 ${activeTab==='home'?'mb-2 scale-110 transition-transform':''}`}></i>動態</button>
                            <button onClick={() => setActiveTab('reminders')} class={`flex flex-col items-center justify-center w-full h-full transition-colors ${activeTab === 'reminders' ? 'text-indigo-600 font-bold' : 'hover:text-gray-600'}`}><i class={`fa-solid fa-heart-pulse text-xl mb-1.5 ${activeTab==='reminders'?'mb-2 scale-110 transition-transform':''}`}></i>健康與提醒</button>
                            <button onClick={() => setActiveTab('aivet')} class={`flex flex-col items-center justify-center w-full h-full transition-colors ${activeTab === 'aivet' ? 'text-indigo-600 font-bold' : 'hover:text-gray-600'}`}><i class={`fa-solid fa-stethoscope text-xl mb-1.5 ${activeTab==='aivet'?'mb-2 scale-110 transition-transform':''}`}></i>急診</button>
                        </div>
                    </div>

                    {showSettings && <SettingsModal userData={userData} onClose={() => setShowSettings(false)} onUpdateUser={handleUpdateUser} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
